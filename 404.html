<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="robots" content="noindex,follow">
  <title>صفحه پیدا نشد | LOYAL GRAPHIC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Estedad:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0%,rgba(255,106,0,.13),transparent 38%),#080808;color:#f5f5f5;font-family:Vazirmatn, sans-serif;text-align:center;overflow:hidden}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(#000,transparent 85%)}
    main{position:relative;width:min(560px,100%);padding:clamp(26px,6vw,48px);border:1px solid rgba(255,106,0,.3);border-radius:28px;background:rgba(15,15,15,.82);box-shadow:0 28px 90px rgba(0,0,0,.48),0 0 55px rgba(255,106,0,.06);backdrop-filter:blur(16px)}
    .mark{width:68px;height:68px;margin:0 auto 20px;display:grid;place-items:center;border:1px solid rgba(255,106,0,.5);border-radius:20px;background:rgba(255,106,0,.08);color:#ff9b4a;font:900 23px Estedad,sans-serif;box-shadow:0 0 36px rgba(255,106,0,.13)}
    .code{font:900 clamp(76px,19vw,118px)/1 Estedad,sans-serif;letter-spacing:-5px;color:#ff7a1a;text-shadow:0 0 40px rgba(255,106,0,.2)}
    h1{margin:14px 0 8px;font:800 clamp(21px,5vw,28px) Estedad,sans-serif}
    p{color:#999;font-size:13px;line-height:2}
    a{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;margin-top:24px;padding:10px 20px;border:1px solid rgba(255,106,0,.45);border-radius:13px;background:linear-gradient(135deg,#ff7a1a,#e85d00);color:#fff;text-decoration:none;font-size:12px;font-weight:800;box-shadow:0 10px 28px rgba(255,106,0,.16);transition:transform .2s ease,box-shadow .2s ease}
    a:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(255,106,0,.25)}
    .foot{margin-top:24px;color:#555;font:700 9px Space Grotesk,sans-serif;letter-spacing:2px}
    @media(prefers-reduced-motion:reduce){a{transition:none}}
  </style>
</head>
<body>
  <main>
    <div class="mark">LG</div>
    <div class="code">404</div>
    <h1>این صفحه اینجا نیست!</h1>
    <p>احتمالاً آدرس اشتباه وارد شده یا صفحه جابه‌جا شده.<br>نگران نباش؛ می‌تونی برگردی و از سایت دیدن کنی.</p>
    <a href="/loyal-graphic/">بازگشت به صفحه اصلی <span aria-hidden="true">↗</span></a>
    <div class="foot">LOYAL GRAPHIC — TAHA LOYAL</div>
  </main>
</body>
</html>
